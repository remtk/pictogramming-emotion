[build]
  publish = "public"
  functions = "netlify/functions"
  # GitHub への push で Netlify へデプロイしない（容量上限対策）
  # 再開するときは次の1行を削除する
  ignore = "exit 0"

# /api/generate-challenge → Netlify Function にリダイレクト
[[redirects]]
  from = "/api/generate-challenge"
  to = "/.netlify/functions/generate-challenge"
  status = 200
  force = true

# /api/question-bank/:id → 問題削除 (DELETE) にリダイレクト
[[redirects]]
  from = "/api/question-bank/:id"
  to = "/.netlify/functions/question-bank"
  status = 200
  force = true

# /api/question-bank → 問題バンク CRUD (GET/POST) にリダイレクト
[[redirects]]
  from = "/api/question-bank"
  to = "/.netlify/functions/question-bank"
  status = 200
  force = true

# SPA フォールバック（必要な場合）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
